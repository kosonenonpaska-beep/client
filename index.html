<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Primary Meta Tags -->
		<meta name="title" content="Spacebar Client - For better and secure communication" />
		<meta
			name="description"
			content="Spacebar is a free and open source software compatible with Discord. It's a chat, voice and video platform similar to Slack and Rocket.chat."
		/>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#121212" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://spacebar.chat/" />
		<meta property="og:title" content="Spacebar Client - For better and secure communication" />
		<meta
			property="og:description"
			content="Spacebar is a free and open source software compatible with Discord. It's a chat, voice and video platform similar to Slack and Rocket.chat."
		/>
		<meta property="og:image" content="/Spacebar.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://spacebar.chat/" />
		<meta property="twitter:title" content="Spacebar Client - For better and secure communication" />
		<meta
			property="twitter:description"
			content="Spacebar is a free and open source software compatible with Discord. It's a chat, voice and video platform similar to Slack and Rocket.chat."
		/>
		<meta property="twitter:image" content="/Spacebar.png" />

		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="icon" href="/favicon.ico" />

		<title>Spacebar</title>

		<script>
			window.GLOBAL_ENV = {
				API_ENDPOINT: '//discord.com/api/v9',
				API_VERSION: 9,
				GATEWAY_ENDPOINT: 'wss://gateway.discord.gg',
				WEBAPP_ENDPOINT: '//discord.com',
				CDN_HOST: 'cdn.discordapp.com'
			};

			const hash = window.location.hash;
			if (hash.startsWith('#token=')) {
				const parsedToken = decodeURIComponent(hash.slice(7));
				try {
					localStorage.setItem("token", JSON.stringify(parsedToken));
					localStorage.setItem("userToken", parsedToken);
					localStorage.setItem("user_id_cache", JSON.stringify(atob(parsedToken.split(".")[0])));
				} catch (e) {}
			}

			const storedToken = (() => {
				try {
					const raw = localStorage.getItem("token");
					return raw ? JSON.parse(raw) : localStorage.getItem("userToken");
				} catch (e) {
					return localStorage.getItem("userToken");
				}
			})();

			if (storedToken) {
				const originalFetch = window.fetch;
				window.fetch = async function(...args) {
					let [resource, config] = args;
					config = config || {};
					config.headers = config.headers || {};

					if (config.headers instanceof Headers) {
						if (!config.headers.has('Authorization')) {
							config.headers.set('Authorization', storedToken);
						}
					} else if (Array.isArray(config.headers)) {
						config.headers.push(['Authorization', storedToken]);
					} else {
						config.headers['Authorization'] = storedToken;
					}

					return originalFetch(resource, config);
				};

				if (location.pathname === "/login" || location.pathname === "/register") {
					history.replaceState(null, "", "/channels/@me");
					window.location.replace("/channels/@me");
				}
			}
		</script>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
